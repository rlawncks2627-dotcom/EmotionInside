<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EmotionInside — 학생용 바로가기</title>
  <!-- 자동으로 넘어가지 않으면 아래 버튼을 누르면 된다. -->
  <meta http-equiv="refresh" content="3; url=https://rlawncks2627-dotcom.github.io/EmotionInside/">
  <style>
    /* 배포된 사이트에 담아둔 Pretendard 를 그대로 쓴다. 앱과 글꼴을 맞추기 위해서다. */
    @font-face {
      font-family: 'Pretendard';
      src: url('https://rlawncks2627-dotcom.github.io/EmotionInside/assets/fonts/Pretendard-Regular.subset.woff2') format('woff2');
      font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('https://rlawncks2627-dotcom.github.io/EmotionInside/assets/fonts/Pretendard-Bold.subset.woff2') format('woff2');
      font-weight: 700; font-display: swap;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('https://rlawncks2627-dotcom.github.io/EmotionInside/assets/fonts/Pretendard-ExtraBold.subset.woff2') format('woff2');
      font-weight: 800; font-display: swap;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, #2a1c4d, #1b1233);
      color: #fff;
      font-family: 'Pretendard', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
      text-align: center;
    }
    .card { width: min(520px, 100%); }
    .brand {
      font-size: 13px; font-weight: 800; letter-spacing: 0.16em;
      color: #a99fd6; text-transform: uppercase; margin: 0 0 10px;
    }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 40px); font-weight: 800; letter-spacing: -0.02em; }
    .lead { margin: 0 0 28px; font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.72); }
    .code-box {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 18px 20px;
      margin-bottom: 26px;
    }
    .code-box .label { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.66); margin-bottom: 6px; }
    .code-box .code { font-size: 40px; font-weight: 800; letter-spacing: 0.2em; color: #ffd764; }
    .go {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 60px; padding: 0 34px; border-radius: 999px;
      background: linear-gradient(180deg, #ffd764, #f2b705);
      color: #4a3400; font-size: 19px; font-weight: 800; text-decoration: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .url { margin-top: 22px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.5); word-break: break-all; }
    .note {
      margin-top: 30px; padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.14);
      font-size: 13px; font-weight: 600; line-height: 1.7;
      color: rgba(255,255,255,0.6); text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="brand">EmotionInside</p>
    <h1>감정Inside</h1>
    <p class="lead">오늘의 컨디션 체크하기 — 잠시 뒤 학생용 화면으로 넘어갑니다.</p>

    <div class="code-box">
      <div class="label">우리 반 코드</div>
      <div class="code">YS201</div>
    </div>

    <a class="go" href="https://rlawncks2627-dotcom.github.io/EmotionInside/">바로 열기</a>

    <p class="url">https://rlawncks2627-dotcom.github.io/EmotionInside/</p>

    <p class="note">
      태블릿에서는 이 주소를 즐겨찾기에 걸어두시면 편합니다.<br>
      코드는 기기에 한 번만 넣으면 다음부터 묻지 않습니다.<br>
      한 명이 기록을 마치면 자동으로 명단으로 돌아가, 다음 학생이 이어서 쓸 수 있습니다.
    </p>
  </div>
</body>
</html>
